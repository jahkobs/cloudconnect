name: Release

# Builds the desktop installers on native runners, where the platform toolchains
# and unrestricted network access needed by electron-builder are available.
#
#   - macOS installers (.dmg + .zip, x64 & arm64) build on macos-latest
#   - Windows installer (.exe NSIS + portable, x64) builds on windows-latest
#   - Linux (.AppImage + .deb) builds on ubuntu-latest
#
# Trigger by pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# or run manually from the Actions tab (workflow_dispatch). Artifacts are always
# uploaded to the workflow run; tag builds also attach them to a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: dist:mac
          - os: windows-latest
            name: Windows
            script: dist:win
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # electron-builder auto-publish off; we upload artifacts explicitly.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer certificate in CI — build an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudconnect-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: false
