<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:;" />
  <title>FusionQuery Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Production warning banner (shown only when the active connection is PROD) -->
    <div id="prod-banner" class="prod-banner" hidden>
      ⚠ PRODUCTION ENVIRONMENT — queries run against live data. Row limits and read-only rules are enforced.
    </div>

    <!-- Title / top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">FusionQuery<strong>Studio</strong></span>
        <span class="brand-ver" id="app-version">v2.0</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-run" class="btn btn-run" title="Run (Ctrl+Enter)">▶ Run</button>
        <button id="btn-run-sel" class="btn btn-ghost" title="Run selection (Ctrl+Shift+Enter)">▷ Selection</button>
        <button id="btn-cancel" class="btn btn-ghost" disabled title="Cancel (Ctrl+.)">■ Stop</button>
        <span class="divider"></span>
        <button id="btn-format" class="btn btn-ghost" title="Format SQL (Ctrl+Shift+F)">⌘ Format</button>
        <button id="btn-save-lib" class="btn btn-ghost" title="Save to library">✚ Save</button>
        <span class="divider"></span>
        <label class="inline-field">Max rows
          <input id="max-rows" type="number" min="1" max="1000000" value="10000" />
        </label>
        <label class="inline-field checkbox"><input id="run-background" type="checkbox" /> Background</label>
      </div>
      <div class="topbar-right">
        <div id="conn-status" class="conn-status state-idle" title="Connection status">
          <span class="conn-dot"></span>
          <span id="conn-status-text" class="conn-status-text">Not connected</span>
          <div class="conn-progress"><div id="conn-progress-bar" class="conn-progress-bar"></div></div>
        </div>
        <select id="connection-select" title="Active connection"><option value="">— no connection —</option></select>
        <button id="btn-reconnect" class="btn btn-ghost" title="Test / reconnect">⟳</button>
        <span id="role-badge" class="role-badge" title="Current role">Query Developer</span>
      </div>
    </header>

    <div class="body">
      <!-- Activity bar -->
      <nav class="activity-bar" id="activity-bar">
        <button class="act active" data-panel="connections" title="Connections">🔌</button>
        <button class="act" data-panel="schema" title="Schema Browser">🗂️</button>
        <button class="act" data-panel="library" title="Query Library">📚</button>
        <button class="act" data-panel="history" title="Query History">🕑</button>
        <button class="act" data-panel="ai" title="AI SQL Assistant">✨</button>
        <button class="act" data-panel="audit" title="Audit Log">🛡️</button>
      </nav>

      <!-- Side panel (content swapped by activity bar) -->
      <aside class="side-panel" id="side-panel">
        <div class="side-head"><span id="side-title">Connections</span>
          <button id="side-action" class="icon-btn" title="Add">＋</button>
        </div>
        <div class="side-body" id="side-body"></div>
      </aside>

      <div class="splitter" id="splitter-v"></div>

      <!-- Workspace: editor + results -->
      <section class="workspace">
        <div class="tabs" id="editor-tabs"></div>
        <div class="editor-area">
          <div class="code-editor">
            <div id="gutter" class="gutter" aria-hidden="true"></div>
            <textarea id="sql-input" class="sql-input" spellcheck="false" wrap="off"
                      autocomplete="off" autocorrect="off" autocapitalize="off"
                      placeholder="-- Write read-only SQL. Ctrl+Enter to run.&#10;SELECT * FROM FUSION.PER_ALL_PEOPLE_F FETCH FIRST 100 ROWS ONLY"></textarea>
          </div>
          <div id="validation-bar" class="validation-bar" hidden></div>
        </div>

        <div class="hsplitter" id="splitter-h"></div>

        <div class="results">
          <div class="results-head">
            <div class="result-tabs" id="result-tabs"></div>
            <div class="results-actions">
              <input id="grid-search" type="search" placeholder="Search results…" />
              <div class="export-menu">
                <button id="btn-export" class="btn btn-ghost">Export ▾</button>
                <div class="export-dropdown" id="export-dropdown" hidden>
                  <button data-fmt="csv">CSV</button>
                  <button data-fmt="xlsx">Excel</button>
                  <button data-fmt="json">JSON</button>
                  <button data-fmt="xml">XML</button>
                </div>
              </div>
            </div>
          </div>
          <div class="result-meta" id="result-meta"></div>
          <div id="grid" class="grid"></div>
          <div class="status-bar">
            <span id="status-msg">Ready.</span>
            <span id="status-right"></span>
          </div>
        </div>
      </section>
    </div>

    <div id="jobs-tray" class="jobs-tray"></div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden><div class="modal" id="modal"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="formatter.js"></script>
  <script src="grid.js"></script>
  <script src="app.js"></script>
</body>
</html>
